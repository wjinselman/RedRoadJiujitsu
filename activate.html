<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Set Up Your Login | Red Road</title><link rel="stylesheet" href="redroad-v25.css?v=prod-49"><link rel="stylesheet" href="experience.css?v=63"><style>body{background:#08090b;color:#fff;margin:0;font-family:Arial,sans-serif}main{max-width:460px;margin:48px auto;padding:24px;background:#111318;border:1px solid #58303a;border-radius:14px}p{line-height:1.5}input{box-sizing:border-box;width:100%;padding:14px;margin:8px 0 18px;background:#20232b;color:white;border:1px solid #555;border-radius:6px}button,a{margin-top:12px}a{color:#eee}label{display:block}@media(max-width:520px){main{margin:20px 12px}}</style></head><body><main><h1>Choose Your Password</h1><p>Confirm the email that received this link, then choose the password you’ll use to sign in.</p><form id="finish-setup-form"><label for="setup-email">Email that received the link</label><input id="setup-email" type="email" autocomplete="email" required><label for="setup-password">Create password</label><input id="setup-password" type="password" minlength="6" autocomplete="new-password" required><label for="setup-confirm">Confirm password</label><input id="setup-confirm" type="password" minlength="6" autocomplete="new-password" required><button class="btn btn-red btn-full" id="finish-setup-submit" type="submit">Save Password</button></form><p id="setup-status" role="status" aria-live="polite"></p><div id="setup-success" hidden><a class="btn btn-red btn-full" href="checkin.html">Go to Class Check-In</a></div><p><a href="members.html">Back to Member Sign In</a></p><noscript>Enable JavaScript to finish account setup.</noscript></main><script type="module" src="email-setup.js?v=1"></script></body></html>
